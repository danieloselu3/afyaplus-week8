# ci.yml - every change goes through the same gates, in order, and only a commit that
# passed all of them can be deployed:
#
#   lint-test -> eval -> mcp-health -> build -> deploy-staging (main) -> deploy-production (tags v*)
#
# Required checks on main (branch protection): lint-test, eval, mcp-health, build.
# Everything runs on the free stub model or recorded answers: no API key, no spend.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  IMAGE: ghcr.io/${{ github.repository_owner }}/afyaplus-triage
  TRIAGE_BACKEND: stub

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: python -m pytest -q
      - name: Prompt pins (every prompt file matches prompts/pin.json; nothing edited in place)
        run: python check_prompt_pin.py
      - name: Release alignment (config, prompt bundle, MCP, image tags, CHANGELOG, tag)
        run: python scripts/check_release.py
      - name: Week 7 cost controls still agree with the cost model
        run: python deploy/validate_budgets.py

  eval:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -r requirements-dev.txt
      - name: Eval gate (golden set, threshold 0.85, safety hard-fail, every servable prompt)
        run: python eval_prompts.py --threshold 0.85
      - name: Eval report
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("evals/report.json")
          if not p.exists():
              print("no eval report"); raise SystemExit
          r = json.loads(p.read_text())
          print(f"### Eval gate: {'PASS' if r['passed'] else 'FAIL'} (threshold {r['threshold']})")
          print("| prompt | sha256 | eval_score | safety failures |\n|---|---|---|---|")
          for v in r["versions"]:
              print(f"| {v['version']} | `{v.get('prompt_sha256', '')[:12]}` | {v.get('eval_score', v.get('error'))} | {v.get('safety_failures', '-')} |")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: eval-report, path: evals/report.json, if-no-files-found: ignore}

  mcp-health:
    needs: eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -r requirements-dev.txt
      - name: MCP health gate (stdio handshake, required tools, version://current, a real call)
        run: python scripts/check_mcp_health.py
      # Route A on purpose: the server speaks stdio, so there is no port to curl.

  build:
    needs: mcp-health
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.meta.outputs.sha }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        name: Release version and commit
        run: |
          echo "version=$(grep -E '^release:' config/triage.yaml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build both images (tags = release and release-commit; never latest)
        run: |
          V=${{ steps.meta.outputs.version }}; S=${{ steps.meta.outputs.sha }}
          docker build --build-arg IMAGE_TAG=$V --build-arg GIT_SHA=$S \
            -t afyaplus-triage:$V -t $IMAGE:$V-$S .
          docker build -f Dockerfile.agent -t afyaplus-agent:$V .
      - name: The image refuses to start without an injected secret (fail closed)
        run: |
          if docker run --rm afyaplus-triage:${{ steps.meta.outputs.version }}; then
            echo "started without JWT_SECRET"; exit 1; fi
      - name: Push to GHCR (main and release tags only; PRs never publish)
        id: push
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          V=${{ steps.meta.outputs.version }}; S=${{ steps.meta.outputs.sha }}
          docker push $IMAGE:$V-$S
          if [ "${{ github.ref_type }}" = "tag" ]; then
            docker tag $IMAGE:$V-$S $IMAGE:$V && docker push $IMAGE:$V
          fi
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' $IMAGE:$V-$S | cut -d@ -f2)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "### Image $IMAGE:$V-$S" >> "$GITHUB_STEP_SUMMARY"
          echo "digest \`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    permissions: {contents: read, packages: read}
    steps:
      - uses: actions/checkout@v4
      - name: Pull the image CI just built, by digest (promote, never rebuild)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull $IMAGE@${{ needs.build.outputs.digest }}
          docker tag $IMAGE@${{ needs.build.outputs.digest }} afyaplus-triage:${{ needs.build.outputs.version }}
      - name: Deploy stub (compose on the runner, stub model) and smoke-test it
        run: pip install -q pyyaml && bash scripts/smoke_deploy.sh
        env:
          WANT_VERSION: ${{ needs.build.outputs.version }}
          WANT_SHA: ${{ needs.build.outputs.sha }}
      - name: Record what was deployed
        run: echo "staging <- afyaplus-triage ${{ needs.build.outputs.version }} @ ${{ needs.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    needs: [build, deploy-staging]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: production
    permissions: {contents: read, packages: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      # v1.3.0 incident: this job installed only pyyaml, but check_release.py imports the MCP
      # server (needs `mcp`), so production promotion failed. Install what the gates need.
      - run: pip install -r requirements-dev.txt
      - name: The tag is the release (v<release>)
        run: python scripts/check_release.py --tag ${{ github.ref_name }}
      - name: Pull the SAME digest staging ran
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull $IMAGE@${{ needs.build.outputs.digest }}
          docker tag $IMAGE@${{ needs.build.outputs.digest }} afyaplus-triage:${{ needs.build.outputs.version }}
      - name: Deploy stub (compose on the runner, stub model) and smoke-test it
        run: pip install -q pyyaml && bash scripts/smoke_deploy.sh
        env:
          WANT_VERSION: ${{ needs.build.outputs.version }}
          WANT_SHA: ${{ needs.build.outputs.sha }}
      - name: Record what was promoted
        run: echo "production <- afyaplus-triage ${{ needs.build.outputs.version }} @ ${{ needs.build.outputs.digest }} (stub deploy, no cloud)" >> "$GITHUB_STEP_SUMMARY"
