# CI: everything runs on the free stub model. No secrets, no API spend.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TRIAGE_BACKEND: stub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Unit tests (API, cache, levers, cost arithmetic, deploy configs)
        run: python -m pytest -q
      - name: Budgets agree with labels and the cost model
        run: python deploy/validate_budgets.py
      - name: Cache hit-rate gate (exits 1 under 0.55)
        run: python levers/cache_hitrate.py --mode on --backend stub
      - name: Cost model and exec one-pager still build from the committed results
        run: |
          python cost/cost_model.py
          python exec/build_one_pager.py

  stack:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Throwaway env file (placeholder JWT secret, stub model)
        run: cp api/.env.example api/.env
      - name: Compose config resolves
        run: docker compose -f deploy/docker-compose.cost.yml config > /dev/null
      - name: Start triage-api + Redis on the stub
        run: TRIAGE_BACKEND=stub docker compose -f deploy/docker-compose.cost.yml up -d --build --wait
      - name: /health reports the Redis cache; the same message is MISS then HIT
        run: |
          curl -sf localhost:8000/health | tee health.json
          grep -q '"cache":"redis"' health.json
          TOKEN=$(curl -sf -X POST localhost:8000/token -H 'Content-Type: application/json' \
            -d '{"username":"mercy","password":"logistics2026"}' | python3 -c "import json,sys; print(json.load(sys.stdin)['access_token'])")
          BODY='{"patient_message":"Fever for two days, drinking fluids","county":"Kisumu"}'
          for want in MISS HIT; do
            got=$(curl -si -X POST localhost:8000/triage -H "Authorization: Bearer $TOKEN" \
              -H 'Content-Type: application/json' -d "$BODY" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-cache"{print $2}')
            echo "want=$want got=$got"; test "$got" = "$want"
          done
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.cost.yml logs
      - run: docker compose -f deploy/docker-compose.cost.yml down
        if: always()
